<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Fixture Images accessibles</title></head>
<body>
<h1>Images : démonstration</h1>
<img data-testid="informative" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Entrée de l'agence bancaire de Lyon">
<img data-testid="decorative" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="">
<a data-testid="logo-link" href="#accueil"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E" alt="Banque Exemple — accueil"></a>
<button type="button" aria-label="Afficher les détails" id="detail-button"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></button>
<p id="detail-result" hidden>Détails affichés</p>
<script>document.querySelector('#detail-button').addEventListener('click',()=>{document.querySelector('#detail-result').hidden=false;});</script>
<h2 id="accueil">Accueil</h2>
</body></html>
